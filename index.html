<!DOCTYPE html>
<html lang="pt">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Tarefas Úteis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <ul id="lista-tarefas"></ul>
    </div>

    <script src="app.js"></script>

</html>
